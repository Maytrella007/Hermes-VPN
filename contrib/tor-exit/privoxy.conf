# Privoxy exists here for one reason: to give Tor an HTTP face, so that every
# part of this plugin that already works with an HTTP proxy keeps working
# unchanged -- the per-profile relay, the managed Chrome policy, the sandbox
# path. Nothing is filtered.

# The container's own address on the exits network, not every interface it
# might ever have. Named rather than numeric because docker assigns the
# address; the name resolves to it and to nothing else.
listen-address exit-tor:8888

# socks5t, not socks5: the "t" sends the hostname to Tor instead of resolving
# it here. Resolving it here would leak every name past the tunnel and would
# never resolve a .onion at all. 127.0.0.1 because this process shares Tor's
# network namespace.
forward-socks5t / 127.0.0.1:9050 .

# Privoxy's own filtering is off. This is a tunnel, not a content proxy, and a
# filter that rewrites pages would be a surprise nobody asked for.
toggle 0
enable-remote-toggle 0
enable-edit-actions 0
enforce-blocks 0

logdir /tmp
logfile privoxy.log
